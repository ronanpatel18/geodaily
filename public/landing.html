<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoDaily — Coming Soon</title>
  <meta name="description" content="GeoDaily is a daily geography game: five Street View locations, one world map, the same challenge for everyone. Coming soon.">
  <meta property="og:title" content="GeoDaily — Coming Soon">
  <meta property="og:description" content="Five places. One map. A new challenge every day.">
  <meta name="theme-color" content="#0b1d2a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2a10 10 0 0 0-10 10c0 7.5 10 18 10 18s10-10.5 10-18A10 10 0 0 0 16 2z' fill='%23ff6b4a'/%3E%3Ccircle cx='16' cy='12' r='4' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1d2a;
      --bg-2: #102a3b;
      --grid: rgba(140, 200, 230, 0.07);
      --dot: rgba(140, 200, 230, 0.22);
      --text: #eaf4f8;
      --muted: #8fb1c2;
      --accent: #ff6b4a;
      --accent-soft: rgba(255, 107, 74, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background:
        radial-gradient(ellipse at 50% 40%, var(--bg-2) 0%, var(--bg) 70%),
        var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      text-align: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Latitude/longitude grid behind everything */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 64px 64px;
      background-position: center;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 640px;
    }

    .marker {
      position: relative;
      width: 72px;
      height: 96px;
      margin: 0 auto 28px;
    }

    .marker svg {
      width: 72px;
      height: 72px;
      display: block;
      animation: drop 1.1s cubic-bezier(.3, 1.6, .6, 1) both, bob 3.5s ease-in-out 1.1s infinite;
      filter: drop-shadow(0 8px 16px rgba(255, 107, 74, 0.35));
    }

    .marker .ripple {
      position: absolute;
      left: 50%;
      bottom: 6px;
      width: 40px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      transform: translateX(-50%);
      opacity: 0;
      animation: ripple 2.4s ease-out 1s infinite;
    }

    .marker .ripple:nth-child(3) { animation-delay: 2.2s; }

    h1 {
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-weight: 700;
      font-size: clamp(3rem, 12vw, 5.5rem);
      letter-spacing: -0.03em;
      line-height: 1;
    }

    h1 span { color: var(--accent); }

    .soon {
      margin-top: 16px;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-weight: 500;
      font-size: clamp(1.25rem, 4.5vw, 1.75rem);
      color: var(--text);
    }

    .soon .dots span {
      display: inline-block;
      animation: blink 1.4s infinite both;
    }
    .soon .dots span:nth-child(2) { animation-delay: .2s; }
    .soon .dots span:nth-child(3) { animation-delay: .4s; }

    .tagline {
      margin: 24px auto 0;
      max-width: 34ch;
      font-size: 1.0625rem;
      line-height: 1.6;
      color: var(--muted);
    }

    .rounds {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 36px;
    }

    .rounds span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--dot);
      animation: fill 6s ease-in-out infinite;
    }
    .rounds span:nth-child(2) { animation-delay: .6s; }
    .rounds span:nth-child(3) { animation-delay: 1.2s; }
    .rounds span:nth-child(4) { animation-delay: 1.8s; }
    .rounds span:nth-child(5) { animation-delay: 2.4s; }

    @keyframes drop {
      from { transform: translateY(-120px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    @keyframes ripple {
      0%   { opacity: .8; width: 16px; height: 5px; }
      100% { opacity: 0;  width: 88px; height: 26px; }
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: .2; }
      40%           { opacity: 1; }
    }

    @keyframes fill {
      0%, 15%   { background: var(--dot); box-shadow: none; }
      25%, 70%  { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
      85%, 100% { background: var(--dot); box-shadow: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .rounds span { background: var(--accent); }
    }
  </style>
</head>
<body>
  <main>
    <div class="marker" aria-hidden="true">
      <svg viewBox="0 0 32 32">
        <path d="M16 2a10 10 0 0 0-10 10c0 7.5 10 18 10 18s10-10.5 10-18A10 10 0 0 0 16 2z" fill="#ff6b4a"/>
        <circle cx="16" cy="12" r="4" fill="#fff"/>
      </svg>
      <div class="ripple"></div>
      <div class="ripple"></div>
    </div>

    <h1>Geo<span>Daily</span></h1>
    <p class="soon">coming soon<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
    <p class="tagline">Five places. One map. A new geography challenge every day, the same for everyone.</p>

    <div class="rounds" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </main>
</body>
</html>
